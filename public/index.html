<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#05080d">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('workadmin-theme')
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) { /* no-op */ }
      })()
    </script>
    <title>work-admin 工作管理中台</title>
  </head>
  <body>
    <noscript>
      <strong>本系统需要启用 JavaScript 才能运行，请开启后重试。</strong>
    </noscript>
    <div id="app"></div>
    <!-- 打包后的 JS / CSS 会自动注入到这里 -->
  </body>
</html>
