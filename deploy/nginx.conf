# work-admin 部署示例（history 路由：必须做 SPA 回退）
# 用法：把 dist/ 里面的文件和目录复制到 root 指向的目录，然后 nginx -t && nginx -s reload
server {
    listen 80;
    server_name _;                     # 有正式域名时改成该域名
    root /usr/share/nginx/html;        # 指向 dist 内容所在目录（不要再套一层 dist）
    index index.html;

    location / {
        # 关键：找不到静态文件就回退到 index.html。
        # 少了这行，/dashboard、/user 直接访问或刷新会 404。
        try_files $uri $uri/ /index.html;
    }

    # 课堂演示包保留 Mock，不需要后端。接入真实后端时取消下面注释：
    # location /api/ {
    #     proxy_pass http://127.0.0.1:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
