server:
  port: 8081
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: work-admin-server
  config:
    # 数据库凭据不提交到 git：放在 server/application-local.yml（模板见 application-local.yml.example）
    import:
      - optional:file:./application-local.yml
      - optional:file:./server/application-local.yml
  datasource:
    # 主库：远程 MySQL（demo 库）。账号/角色/菜单/群聊都直接用 stu 的真实表，
    # 项目不建自己的表，也不引入 JPA，所以永远不会改动对方的表结构。
    url: ${DB_URL:jdbc:mysql://118.25.25.164:3306/demo?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&connectTimeout=8000&socketTimeout=20000}
    username: ${DB_USERNAME:stu}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: workadmin-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      connection-test-query: SELECT 1

logging:
  level:
    root: INFO
    com.example.workadmin: DEBUG
